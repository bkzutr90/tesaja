<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Goal Widget</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { width: 420px; }
  .goal-label { font-size: 14px; font-weight: 700; margin-bottom: 8px; display: flex; justify-content: space-between; }
  .goal-label .count { color: var(--cyan); }
  .bar-track { height: 22px; border-radius: 11px; background: rgba(255,255,255,0.08); overflow: hidden; border: 1px solid var(--panel-line); }
  .bar-fill { height: 100%; border-radius: 11px; background: linear-gradient(90deg, var(--cyan), var(--pink)); width: 0%; transition: width 0.6s ease; }
  .icon { font-size: 16px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-title"><span class="icon" id="icon">🎯</span><span id="label">GOAL</span></div>
    <div class="goal-label">
      <span id="type-label" class="mono">-</span>
      <span class="count mono" id="count-label">0 / 0</span>
    </div>
    <div class="bar-track"><div class="bar-fill" id="fill"></div></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const WS_URL = (params.get('server') || (location.origin.replace('http', 'ws') + '/ws'));

  const ICONS = { likes: '❤️', followers: '➕', coins: '💎', share: '🔁' };
  const NAMES = { likes: 'LIKES', followers: 'FOLLOWERS', coins: 'COINS', share: 'SHARES' };

  function render(goal) {
    if (!goal) return;
    document.getElementById('icon').textContent = ICONS[goal.type] || '🎯';
    document.getElementById('label').textContent = goal.label || 'GOAL';
    document.getElementById('type-label').textContent = NAMES[goal.type] || goal.type.toUpperCase();
    document.getElementById('count-label').textContent = `${goal.current} / ${goal.target}`;
    const pct = goal.target > 0 ? Math.min(100, (goal.current / goal.target) * 100) : 0;
    document.getElementById('fill').style.width = pct + '%';
  }

  function connect() {
    const ws = new WebSocket(WS_URL);
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'goal') render(msg.payload);
      if (msg.type === 'state') render(msg.payload.goal);
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
</body>
</html>
