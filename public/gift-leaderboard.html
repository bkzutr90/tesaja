<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Gifter Leaderboard</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { width: 340px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-title"><span class="dot" style="background:var(--gold);box-shadow:0 0 8px var(--gold)"></span>TOP GIFTERS</div>
    <div id="list"></div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const COUNT = Math.max(1, parseInt(params.get('count') || '5', 10));
  const WS_URL = (params.get('server') || (location.origin.replace('http', 'ws') + '/ws'));

  const listEl = document.getElementById('list');

  function medalClass(i) {
    return i === 0 ? 'r1' : i === 1 ? 'r2' : i === 2 ? 'r3' : '';
  }

  function render(entries) {
    const top = entries.slice(0, COUNT);
    if (!top.length) {
      listEl.innerHTML = '<div class="empty-hint">Belum ada gift masuk...</div>';
      return;
    }
    listEl.innerHTML = top.map((u, i) => `
      <div class="row">
        <div class="rank ${medalClass(i)}">${i + 1}</div>
        <img class="avatar" src="${u.profilePicture || ''}" onerror="this.style.visibility='hidden'" />
        <div class="name">${escapeHtml(u.nickname || u.uniqueId)}</div>
        <div class="value">${formatNum(u.diamonds)} 💎</div>
      </div>
    `).join('');
  }

  function formatNum(n) {
    if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'M';
    if (n >= 1_000) return (n / 1_000).toFixed(1) + 'K';
    return String(n);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function connect() {
    const ws = new WebSocket(WS_URL);
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'giftLeaderboard') render(msg.payload);
      if (msg.type === 'state') render(msg.payload.giftLeaderboard);
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
</body>
</html>
