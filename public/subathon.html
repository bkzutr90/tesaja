<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<title>Subathon Timer</title>
<link rel="stylesheet" href="shared.css" />
<style>
  body { width: 300px; }
  .clock {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 40px;
    text-align: center;
    letter-spacing: 0.03em;
    background: linear-gradient(90deg, var(--cyan), var(--pink));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status { text-align: center; font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-title"><span class="dot"></span>SUBATHON</div>
    <div class="clock" id="clock">00:00:00</div>
    <div class="status" id="status">menunggu koneksi...</div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const WS_URL = (params.get('server') || (location.origin.replace('http', 'ws') + '/ws'));

  let endsAt = null;
  let active = false;

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    if (!active || !endsAt) return;
    const remainMs = Math.max(0, endsAt - Date.now());
    const totalSec = Math.floor(remainMs / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    document.getElementById('clock').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    document.getElementById('status').textContent = remainMs > 0 ? 'LIVE — waktu bertambah tiap gift/like/follow' : 'WAKTU HABIS';
  }
  setInterval(tick, 1000);

  function render(sub) {
    if (!sub) return;
    active = sub.active;
    endsAt = sub.endsAt;
    if (!active) document.getElementById('status').textContent = 'subathon belum dimulai';
    tick();
  }

  function connect() {
    const ws = new WebSocket(WS_URL);
    ws.onmessage = (ev) => {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'subathon') render(msg.payload);
      if (msg.type === 'state') render(msg.payload.subathon);
    };
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
  }
  connect();
</script>
</body>
</html>
